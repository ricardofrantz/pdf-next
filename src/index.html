<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pdf-next</title>
    <link rel="stylesheet" href="./vendor/pdfjs/web/pdf_viewer.css" />
    <link rel="stylesheet" href="./vendor/pulldown-latex/styles.css" />
    <link rel="stylesheet" href="./style.css" />
    <!-- Filled before a print with the @page rule that gives the paper the
         shape of the PDF's own pages. Empty otherwise, which leaves markdown
         and images the margins the system prints with. -->
    <style id="printRules"></style>
  </head>
  <body class="mode-auto">
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-prev" viewBox="0 0 16 16" fill="none">
        <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-next" viewBox="0 0 16 16" fill="none">
        <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-zoom-out" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.2 10.2L13.2 13.2M5.25 7H8.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-zoom-in" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.2 10.2L13.2 13.2M5.25 7H8.75M7 5.25V8.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-find" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.2 10.2L13.2 13.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-mode" viewBox="0 0 16 16" fill="none">
        <path d="M13 9.6A5.4 5.4 0 0 1 6.4 3 5.5 5.5 0 1 0 13 9.6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-rotate" viewBox="0 0 16 16" fill="none">
        <path d="M13 8A5 5 0 1 1 9.8 3.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M9.5 1.5L12 3.5L9.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-open" viewBox="0 0 16 16" fill="none">
        <path d="M2.5 12.5V4.5C2.5 3.95 2.95 3.5 3.5 3.5H6.5L8 5.5H12.5C13.05 5.5 13.5 5.95 13.5 6.5V12.5C13.5 13.05 13.05 13.5 12.5 13.5H3.5C2.95 13.5 2.5 13.05 2.5 12.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-up" viewBox="0 0 16 16" fill="none">
        <path d="M3.5 10L8 5.5L12.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-down" viewBox="0 0 16 16" fill="none">
        <path d="M3.5 6L8 10.5L12.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-dock-left" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="3.5" width="6" height="9" rx="1" fill="currentColor"/>
        <rect x="8.9" y="3.5" width="5.6" height="9" rx="1" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/>
      </symbol>
      <symbol id="i-dock-right" viewBox="0 0 16 16" fill="none">
        <rect x="8.5" y="3.5" width="6" height="9" rx="1" fill="currentColor"/>
        <rect x="1.5" y="3.5" width="5.6" height="9" rx="1" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/>
      </symbol>
      <symbol id="i-dock-top" viewBox="0 0 16 16" fill="none">
        <rect x="3.5" y="1.5" width="9" height="6" rx="1" fill="currentColor"/>
        <rect x="3.5" y="8.9" width="9" height="5.6" rx="1" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/>
      </symbol>
      <symbol id="i-dock-bottom" viewBox="0 0 16 16" fill="none">
        <rect x="3.5" y="8.5" width="9" height="6" rx="1" fill="currentColor"/>
        <rect x="3.5" y="1.5" width="9" height="5.6" rx="1" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/>
      </symbol>
      <symbol id="i-dock-center" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/>
        <rect x="5.2" y="5.6" width="5.6" height="4.8" rx="0.6" fill="currentColor"/>
      </symbol>
      <symbol id="i-raw" viewBox="0 0 16 16" fill="none">
        <path d="M5.5 4.5L2 8L5.5 11.5M10.5 4.5L14 8L10.5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-update" viewBox="0 0 16 16" fill="none">
        <path d="M8 2.5V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2.5 10.5V12.5C2.5 13.05 2.95 13.5 3.5 13.5H12.5C13.05 13.5 13.5 13.05 13.5 12.5V10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-print" viewBox="0 0 16 16" fill="none">
        <path d="M4.5 6V2.5H11.5V6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M4.5 11.5H3C2.45 11.5 2 11.05 2 10.5V7C2 6.45 2.45 6 3 6H13C13.55 6 14 6.45 14 7V10.5C14 11.05 13.55 11.5 13 11.5H11.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <rect x="4.5" y="9.5" width="7" height="4" rx="0.6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 16 16" fill="none">
        <path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-wrap" viewBox="0 0 16 16" fill="none">
        <path d="M2 5.5V3.5C2 2.95 2.45 2.5 3 2.5H5M11 2.5H13C13.55 2.5 14 2.95 14 3.5V5.5M14 10.5V12.5C14 13.05 13.55 13.5 13 13.5H11M5 13.5H3C2.45 13.5 2 13.05 2 12.5V10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="5.6" y="5.6" width="4.8" height="4.8" rx="0.6" fill="currentColor"/>
      </symbol>
    </svg>

    <header id="bar">
      <div class="group">
        <button id="open" type="button" title="Open (Ctrl+O)" aria-label="Open file">
          <svg class="icon"><use href="#i-open"/></svg>
        </button>
      </div>
      <div class="sep"></div>
      <div class="group pdf-only">
        <button id="prev" type="button" title="Previous page (k)" aria-label="Previous page">
          <svg class="icon"><use href="#i-prev"/></svg>
        </button>
        <button id="next" type="button" title="Next page (j)" aria-label="Next page">
          <svg class="icon"><use href="#i-next"/></svg>
        </button>
        <input id="page" type="number" min="1" value="1" aria-label="Page number" />
        <span id="pages" class="dim">/ —</span>
      </div>
      <div class="group image-only">
        <button id="imagePrev" type="button" title="Previous file in folder (Left)" aria-label="Previous file in folder">
          <svg class="icon"><use href="#i-prev"/></svg>
        </button>
        <button id="imageNext" type="button" title="Next file in folder (Right)" aria-label="Next file in folder">
          <svg class="icon"><use href="#i-next"/></svg>
        </button>
        <span id="imageIndex" class="dim"></span>
        <button id="rotate" type="button" title="Rotate a quarter turn clockwise" aria-label="Rotate a quarter turn clockwise" aria-pressed="false">
          <svg class="icon"><use href="#i-rotate"/></svg>
        </button>
      </div>
      <div class="sep image-only"></div>
      <div class="sep pdf-only"></div>
      <div class="group">
        <button id="zoomOut" type="button" title="Zoom out (-)" aria-label="Zoom out">
          <svg class="icon"><use href="#i-zoom-out"/></svg>
        </button>
        <select id="zoom" aria-label="Zoom">
          <option value="auto">Auto</option>
          <option value="page-fit">Fit page</option>
          <option value="page-width">Fit width</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
          <option value="4">400%</option>
        </select>
        <button id="zoomIn" type="button" title="Zoom in (+)" aria-label="Zoom in">
          <svg class="icon"><use href="#i-zoom-in"/></svg>
        </button>
      </div>
      <div class="spacer"></div>
      <div class="group">
        <button id="findToggle" type="button" class="pdf-only" title="Find (Ctrl+F)" aria-label="Find in document">
          <svg class="icon"><use href="#i-find"/></svg>
        </button>
        <button id="raw" type="button" class="md-only" title="Show the raw markdown (Ctrl+U)" aria-label="Show the raw markdown" aria-pressed="false">
          <svg class="icon"><use href="#i-raw"/></svg>
        </button>
        <button id="print" type="button" title="Print (Ctrl+P)" aria-label="Print">
          <svg class="icon"><use href="#i-print"/></svg>
        </button>
        <button id="mode" type="button" title="Page mode (Shift+click to clear)" aria-label="Page mode" aria-pressed="false">
          <svg class="icon"><use href="#i-mode"/></svg>
        </button>
        <button id="wrap" type="button" title="Fit the window to the content (Ctrl+Shift+F)" aria-label="Fit the window to the content" aria-pressed="false">
          <svg class="icon"><use href="#i-wrap"/></svg>
        </button>
        <span class="group" id="dockGroup" role="group" aria-label="Dock the window">
          <button id="dockLeft" type="button" title="Fill the left half of the screen (Ctrl+Shift+Left)" aria-label="Fill the left half of the screen" aria-pressed="false">
            <svg class="icon"><use href="#i-dock-left"/></svg>
          </button>
          <button id="dockTop" type="button" title="Fill the top half of the screen (Ctrl+Shift+Up)" aria-label="Fill the top half of the screen" aria-pressed="false">
            <svg class="icon"><use href="#i-dock-top"/></svg>
          </button>
          <button id="dockCenter" type="button" title="Center and fit the window to the page (Ctrl+Shift+Enter)" aria-label="Center and fit the window to the page">
            <svg class="icon"><use href="#i-dock-center"/></svg>
          </button>
          <button id="dockBottom" type="button" title="Fill the bottom half of the screen (Ctrl+Shift+Down)" aria-label="Fill the bottom half of the screen" aria-pressed="false">
            <svg class="icon"><use href="#i-dock-bottom"/></svg>
          </button>
          <button id="dockRight" type="button" title="Fill the right half of the screen (Ctrl+Shift+Right)" aria-label="Fill the right half of the screen" aria-pressed="false">
            <svg class="icon"><use href="#i-dock-right"/></svg>
          </button>
        </span>
        <select id="poll" title="Check the file for changes every…" aria-label="Auto reload interval">
          <option value="1">1s</option>
          <option value="2">2s</option>
          <option value="3">3s</option>
          <option value="0">Off</option>
        </select>
        <span id="waiting" title="The file is being rebuilt" hidden>
          <span class="dot"></span>
        </span>
        <button id="update" type="button" title="Check for updates" aria-label="Check for updates">
          <svg class="icon"><use href="#i-update"/></svg>
        </button>
      </div>
    </header>

    <div id="tabs" role="tablist" aria-label="Open files"></div>

    <main id="stage">
      <div id="viewerContainer" tabindex="0">
        <div id="viewer" class="pdfViewer"></div>
      </div>
      <div id="imageStage" hidden>
        <!-- The box is the picture's place in the layout. Upright it simply
             wraps the image; turned a quarter, script gives it the swapped
             size and the image is rotated inside it. -->
        <div id="imageBox">
          <img id="image" alt="" />
        </div>
      </div>
      <div id="markdownStage">
        <article id="markdown"></article>
        <pre id="markdownRaw" hidden></pre>
      </div>

      <div id="find" hidden>
        <input id="findInput" type="search" placeholder="Find" aria-label="Find" />
        <span id="findCount" class="dim" aria-live="polite"></span>
        <button id="findPrev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">
          <svg class="icon"><use href="#i-up"/></svg>
        </button>
        <button id="findNext" type="button" title="Next match (Enter)" aria-label="Next match">
          <svg class="icon"><use href="#i-down"/></svg>
        </button>
        <button id="findClose" type="button" title="Close (Esc)" aria-label="Close find">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>

      <div id="empty">
        <svg class="empty-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="9" y="5.5" width="30" height="37" rx="3" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
          <path d="M24 16v14m0 0-5.5-5.5M24 30l5.5-5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="empty-title">Drop a PDF, image or markdown file here</p>
        <p class="dim">or press <kbd>Ctrl</kbd>+<kbd>O</kbd> to browse</p>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </main>

    <!-- Empty on screen. A print fills it with one image per PDF page, at
         print resolution, and the print stylesheet hides everything else. -->
    <div id="printPages" aria-hidden="true"></div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
