name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (.exe, .msi)
            args: ''
            rust-targets: ''
          - platform: macos-latest
            label: macOS universal (.dmg)
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-latest
            label: Ubuntu (.AppImage, .deb)
            args: ''
            rust-targets: ''

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pdf-next ${{ github.ref_name }}
          releaseBody: |
            Download the build for your system below.

            - **Windows** — `.exe` installer. SmartScreen will warn because the
              binary is unsigned: choose *More info -> Run anyway*.
            - **macOS** — universal `.dmg` (Intel and Apple Silicon). Unsigned,
              so first launch needs
              `xattr -d com.apple.quarantine /Applications/pdf-next.app`.
            - **Ubuntu** — `.AppImage` (chmod +x and run) or `.deb`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
