name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (.exe, .msi)
            args: ''
            rust-targets: ''
          - platform: macos-latest
            label: macOS universal (.dmg)
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-latest
            label: Ubuntu (.AppImage, .deb)
            args: ''
            rust-targets: ''

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Windows binaries are signed with Azure Trusted Signing when the
      # repository holds the credentials; without them the build is the same,
      # just unsigned. See docs/distribution.md for the Azure side. Secrets:
      # AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET. Variables:
      # AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE.
      # The sign command is handed to Tauri as a config overlay, so a build
      # without credentials never sees it and the shared config stays
      # platform-neutral.
      - name: Prepare code signing
        id: signing
        if: matrix.platform == 'windows-latest' && env.HAS_SIGNING == 'true'
        env:
          HAS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --version 0.11.0 --locked
          $command = "trusted-signing-cli -e $env:ENDPOINT -a $env:ACCOUNT -c $env:PROFILE %1"
          @{ bundle = @{ windows = @{ signCommand = $command } } } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Path signing.conf.json -Encoding utf8
          "args=--config signing.conf.json" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pdf-next ${{ github.ref_name }}
          releaseBody: |
            Download the build for your system below.

            - **Windows** — `.exe` installer, or `winget install RicardoFrantz.pdf-next`.
              If SmartScreen warns (an unsigned build), choose *More info -> Run anyway*.
            - **macOS** — universal `.dmg` (Intel and Apple Silicon), or
              `brew install --cask --no-quarantine ricardofrantz/tap/pdf-next`.
              Unsigned, so a first launch from the `.dmg` needs
              `xattr -d com.apple.quarantine /Applications/pdf-next.app`.
            - **Debian and Ubuntu** — `apt install pdf-next` once the
              repository at https://ricardofrantz.github.io/pdf-next is added
              (see the README), or the `.deb` and `.AppImage` below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}

  # The apt repository is a branch of this repository served by GitHub Pages:
  # the .deb the job above just published, plus the index files apt reads and
  # a signature over them. Without APT_GPG_PRIVATE_KEY the job says so and
  # stops, because an unsigned repository is one apt refuses by default.
  apt:
    name: apt repository
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check for the signing key
        id: key
        env:
          HAS_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          [ "$HAS_KEY" = true ] || echo "::warning::APT_GPG_PRIVATE_KEY is not set; skipping the apt repository."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.key.outputs.present == 'true'
        with:
          ref: gh-pages
          path: pages

      - name: Build and sign the repository
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

          version=${TAG#v}
          cd pages
          mkdir -p pool/main/p/pdf-next dists/stable/main/binary-amd64
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*_amd64.deb' --dir pool/main/p/pdf-next --clobber

          # Every version stays in the pool, so `apt install pdf-next=0.9.0`
          # keeps working after a newer one lands.
          dpkg-scanpackages --multiversion --arch amd64 pool > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=pdf-next \
            -o APT::FTPArchive::Release::Label=pdf-next \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="pdf-next releases" \
            release dists/stable > Release.tmp
          # Written outside the tree first: the redirect would otherwise create
          # the file before the scan, and Release would list itself.
          mv Release.tmp dists/stable/Release

          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          printf '%s' "$PRIVATE_KEY" | gpg --batch --quiet --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          # InRelease is what current apt reads; Release.gpg is for older ones.
          gpg --batch --yes --local-user "$fingerprint" \
            --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$fingerprint" \
            --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export "$fingerprint" > pdf-next.asc
          rm -rf "$GNUPGHOME"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "pdf-next $version" || { echo 'Nothing changed.'; exit 0; }
          git push
